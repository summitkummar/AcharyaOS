<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AcharyaOS - The Teacher's OS</title>
    
    <!-- Tailwind CSS (डिज़ाइन के लिए) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome (आइकॉन के लिए) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts (सुंदर अक्षरों के लिए) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', 'Noto Sans Devanagari', sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-20">

    <!-- 1. हेडर (Header) -->
    <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white p-5 pt-8 rounded-b-[2.5rem] shadow-lg relative z-10">
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2 rounded-xl">
                    <i class="fas fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">AcharyaOS</h1>
                    <p class="text-[10px] tracking-widest opacity-80 uppercase">The Teacher's OS</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button class="bg-white/20 w-9 h-9 rounded-xl flex items-center justify-center"><i class="fas fa-moon"></i></button>
                <button class="bg-white/20 w-9 h-9 rounded-xl flex items-center justify-center"><i class="fas fa-globe"></i></button>
                <button class="bg-white/20 w-9 h-9 rounded-xl flex items-center justify-center"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </div>
    </div>

    <!-- मुख्य सामग्री -->
    <div class="px-4 -mt-6 relative z-20">

        <!-- 2. ग्रीटिंग कार्ड (Greeting Card) -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 flex justify-between items-center mb-4">
            <div>
                <h2 class="text-xl font-bold text-gray-800">नमस्ते, Teacher जी! 🙏</h2>
                <p class="text-sm text-gray-500 mt-1">आज का दिन शुभ हो</p>
                <div class="flex items-center gap-2 mt-3 text-xs text-purple-700 font-semibold bg-purple-50 px-3 py-1.5 rounded-full w-max">
                    <i class="far fa-calendar-alt"></i>
                    <span id="current-date"></span>
                </div>
            </div>
            <div class="w-16 h-16 bg-gradient-to-br from-purple-400 to-indigo-500 rounded-2xl flex items-center justify-center shadow-md">
                <i class="fas fa-user-tie text-2xl text-white"></i>
            </div>
        </div>

        <!-- 3. स्टैट्स कार्ड्स (Stats Cards) -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <!-- Classes -->
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
                <div class="w-10 h-10 rounded-xl bg-purple-100 flex items-center justify-center text-purple-600 mb-3">
                    <i class="fas fa-users text-lg"></i>
                </div>
                <p class="text-xs text-gray-500 font-bold tracking-wider mb-1">CLASSES</p>
                <p class="text-3xl font-bold text-gray-800" id="classes-count">0</p>
            </div>

            <!-- Students -->
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
                <div class="w-10 h-10 rounded-xl bg-green-100 flex items-center justify-center text-green-600 mb-3">
                    <i class="fas fa-user-graduate text-lg"></i>
                </div>
                <p class="text-xs text-gray-500 font-bold tracking-wider mb-1">STUDENTS</p>
                <p class="text-3xl font-bold text-gray-800" id="students-count">0</p>
            </div>

            <!-- Attendance -->
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
                <div class="w-10 h-10 rounded-xl bg-orange-100 flex items-center justify-center text-orange-500 mb-3">
                    <i class="fas fa-user-check text-lg"></i>
                </div>
                <p class="text-xs text-gray-500 font-bold tracking-wider mb-1">आज उपस्थित</p>
                <p class="text-3xl font-bold text-gray-800" id="attendance-count">-</p>
            </div>

            <!-- Diary -->
            <div class="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
                <div class="w-10 h-10 rounded-xl bg-purple-100 flex items-center justify-center text-purple-600 mb-3">
                    <i class="fas fa-book text-lg"></i>
                </div>
                <p class="text-xs text-gray-500 font-bold tracking-wider mb-1">DIARY</p>
                <p class="text-3xl font-bold text-gray-800" id="diary-count">0</p>
            </div>
        </div>

        <!-- 4. तुरंत काम (Quick Actions) -->
        <div class="flex items-center gap-2 mb-4">
            <div class="bg-purple-100 text-purple-600 p-1.5 rounded-lg"><i class="fas fa-bolt text-sm"></i></div>
            <h3 class="font-bold text-gray-800 text-lg">तुरंत काम</h3>
        </div>

        <div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2">
            <button onclick="addClass()" class="flex-shrink-0 w-24 bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2">
                <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center"><i class="fas fa-plus"></i></div>
                <span class="text-xs font-semibold text-gray-700">Class</span>
            </button>
            
            <button onclick="addStudent()" class="flex-shrink-0 w-24 bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2">
                <div class="w-10 h-10 rounded-xl bg-green-50 text-green-600 flex items-center justify-center"><i class="fas fa-user-check"></i></div>
                <span class="text-xs font-semibold text-gray-700">Attend</span>
            </button>
            
            <button onclick="addDiary()" class="flex-shrink-0 w-24 bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2">
                <div class="w-10 h-10 rounded-xl bg-orange-50 text-orange-500 flex items-center justify-center"><i class="fas fa-book-open"></i></div>
                <span class="text-xs font-semibold text-gray-700">Diary</span>
            </button>
            
            <button class="flex-shrink-0 w-24 bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2">
                <div class="w-10 h-10 rounded-xl bg-pink-50 text-pink-500 flex items-center justify-center"><i class="fas fa-star"></i></div>
                <span class="text-xs font-semibold text-gray-700">Marks</span>
            </button>
        </div>
    </div>

    <!-- 5. फ्लोटिंग एक्शन बटन (FAB) -->
    <button onclick="addClass()" class="fixed bottom-24 right-4 w-14 h-14 bg-gradient-to-r from-purple-600 to-pink-500 text-white rounded-full shadow-lg flex items-center justify-center text-2xl z-40">
        <i class="fas fa-plus"></i>
    </button>

    <!-- 6. बॉटम नेविगेशन (Bottom Navigation) -->
    <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 flex justify-around items-center py-3 pb-safe z-50 rounded-t-2xl shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
        <button class="flex flex-col items-center gap-1 text-purple-600">
            <i class="fas fa-home text-lg"></i>
            <span class="text-[10px] font-semibold">Home</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-purple-600 transition">
            <i class="fas fa-users text-lg"></i>
            <span class="text-[10px] font-medium">Classes</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-purple-600 transition">
            <i class="fas fa-user-check text-lg"></i>
            <span class="text-[10px] font-medium">Attend</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-purple-600 transition">
            <i class="fas fa-book text-lg"></i>
            <span class="text-[10px] font-medium">Diary</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-purple-600 transition">
            <i class="fas fa-star text-lg"></i>
            <span class="text-[10px] font-medium">Marks</span>
        </button>
    </div>

    <!-- ================== जावास्क्रिप्ट कोड (डेटा सेव करने के लिए) ================== -->
    <script>
        // आज की तारीख दिखाने के लिए
        const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('hi-IN', dateOptions);

        // डेटा लोड करने का फंक्शन
        function loadData() {
            let classes = localStorage.getItem('acharya_classes') || 0;
            let students = localStorage.getItem('acharya_students') || 0;
            let diary = localStorage.getItem('acharya_diary') || 0;

            document.getElementById('classes-count').innerText = classes;
            document.getElementById('students-count').innerText = students;
            document.getElementById('diary-count').innerText = diary;
        }

        // नया क्लास जोड़ने का फंक्शन
        function addClass() {
            let classes = parseInt(localStorage.getItem('acharya_classes') || 0);
            classes++;
            localStorage.setItem('acharya_classes', classes);
            loadData();
        }

        // नया स्टूडेंट जोड़ने का फंक्शन
        function addStudent() {
            let students = parseInt(localStorage.getItem('acharya_students') || 0);
            students++;
            localStorage.setItem('acharya_students', students);
            loadData();
        }

        // नई डायरी एंट्री जोड़ने का फंक्शन
        function addDiary() {
            let diary = parseInt(localStorage.getItem('acharya_diary') || 0);
            diary++;
            localStorage.setItem('acharya_diary', diary);
            loadData();
        }

        // पेज लोड होते ही डेटा दिखाएं
        document.addEventListener('DOMContentLoaded', loadData);

        // PWA (ऐप) बनाने के लिए सर्विस वर्कर रजिस्टर करें
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch((err) => console.log('Service Worker Error', err));
        }
    </script>
</body>
</html>
