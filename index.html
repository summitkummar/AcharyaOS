<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AcharyaOS - The Teacher's OS</title>
    
    <!-- 🔥 ब्रांडिंग और शेयरिंग के लिए (WhatsApp पर लिंक भेजने पर यह दिखेगा) 🔥 -->
    <meta property="og:title" content="AcharyaOS - The Teacher's OS">
    <meta property="og:description" content="शिक्षकों के लिए एक आधुनिक डिजिटल सहायक। क्लास, स्टूडेंट्स और अटेंडेंस को मैनेज करें आसानी से।">
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/3976/3976606.png">
    <meta property="og:url" content="https://summitkummar.github.io/">
    <meta name="theme-color" content="#6a0dad">

    <!-- Tailwind CSS (डिज़ाइन के लिए) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome (आइकॉन के लिए) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', 'Noto Sans Devanagari', sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>
<body class="pb-20">

    <!-- ================== 1. हेडर (Branding + Share Button) ================== -->
    <div class="bg-gradient-to-r from-purple-700 to-indigo-600 text-white p-5 pt-8 rounded-b-[2.5rem] shadow-lg relative z-10">
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2 rounded-xl">
                    <i class="fas fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">AcharyaOS</h1>
                    <p class="text-[10px] tracking-widest opacity-80 uppercase">The Teacher's OS</p>
                </div>
            </div>
            <!-- शेयर बटन -->
            <button onclick="shareApp()" class="bg-white/20 w-10 h-10 rounded-xl flex items-center justify-center active:scale-95 transition">
                <i class="fas fa-share-alt text-lg"></i>
            </button>
        </div>
    </div>

    <!-- मुख्य सामग्री -->
    <div class="px-4 -mt-6 relative z-20">

        <!-- ================== स्क्रीन 1: होम (Home) ================== -->
        <div id="screen-home" class="screen active">
            <!-- ग्रीटिंग कार्ड -->
            <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 flex justify-between items-center mb-4">
                <div>
                    <h2 class="text-xl font-bold text-gray-800">नमस्ते, Teacher जी! 🙏</h2>
                    <p class="text-sm text-gray-500 mt-1">आज का दिन शुभ हो</p>
                    <div class="flex items-center gap-2 mt-3 text-xs text-purple-700 font-semibold bg-purple-50 px-3 py-1.5 rounded-full w-max">
                        <i class="far fa-calendar-alt"></i>
                        <span id="current-date"></span>
                    </div>
                </div>
                <div class="w-16 h-16 bg-gradient-to-br from-purple-400 to-indigo-500 rounded-2xl flex items-center justify-center shadow-md">
                    <i class="fas fa-user-tie text-2xl text-white"></i>
                </div>
            </div>

            <!-- स्टैट्स कार्ड्स -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
                    <div class="w-10 h-10 rounded-xl bg-purple-100 flex items-center justify-center text-purple-600 mb-3">
                        <i class="fas fa-users text-lg"></i>
                    </div>
                    <p class="text-xs text-gray-500 font-bold tracking-wider mb-1">TOTAL CLASSES</p>
                    <p class="text-3xl font-bold text-gray-800" id="home-classes-count">0</p>
                </div>
                <div class="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
                    <div class="w-10 h-10 rounded-xl bg-green-100 flex items-center justify-center text-green-600 mb-3">
                        <i class="fas fa-user-graduate text-lg"></i>
                    </div>
                    <p class="text-xs text-gray-500 font-bold tracking-wider mb-1">TOTAL STUDENTS</p>
                    <p class="text-3xl font-bold text-gray-800" id="home-students-count">0</p>
                </div>
            </div>

            <!-- तुरंत काम (Quick Actions) -->
            <div class="flex items-center gap-2 mb-4">
                <div class="bg-purple-100 text-purple-600 p-1.5 rounded-lg"><i class="fas fa-bolt text-sm"></i></div>
                <h3 class="font-bold text-gray-800 text-lg">तुरंत काम</h3>
            </div>
            <div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2">
                <button onclick="openAddModal('class')" class="flex-shrink-0 w-24 bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2">
                    <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center"><i class="fas fa-plus"></i></div>
                    <span class="text-xs font-semibold text-gray-700">Add Class</span>
                </button>
                <button onclick="openAddModal('student')" class="flex-shrink-0 w-24 bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2">
                    <div class="w-10 h-10 rounded-xl bg-green-50 text-green-600 flex items-center justify-center"><i class="fas fa-user-plus"></i></div>
                    <span class="text-xs font-semibold text-gray-700">Add Student</span>
                </button>
                <button onclick="shareApp()" class="flex-shrink-0 w-24 bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2">
                    <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center"><i class="fas fa-share-alt"></i></div>
                    <span class="text-xs font-semibold text-gray-700">Share App</span>
                </button>
            </div>
        </div>

        <!-- ================== स्क्रीन 2: क्लासेज (Classes) ================== -->
        <div id="screen-classes" class="screen">
            <div class="flex justify-between items-center mb-4 mt-2">
                <h2 class="text-xl font-bold text-gray-800">आपकी क्लासेज</h2>
                <button onclick="openAddModal('class')" class="bg-purple-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md active:scale-95 transition">
                    <i class="fas fa-plus mr-1"></i> नई क्लास
                </button>
            </div>
            <div id="classes-list" class="space-y-3">
                <!-- क्लासेज की लिस्ट यहाँ आएगी -->
                <p class="text-gray-400 text-center py-10 text-sm">अभी कोई क्लास नहीं जोड़ी गई है।</p>
            </div>
        </div>

        <!-- ================== स्क्रीन 3: स्टूडेंट्स (Students) ================== -->
        <div id="screen-students" class="screen">
            <div class="flex justify-between items-center mb-4 mt-2">
                <h2 class="text-xl font-bold text-gray-800">सभी स्टूडेंट्स</h2>
                <button onclick="openAddModal('student')" class="bg-green-600 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md active:scale-95 transition">
                    <i class="fas fa-plus mr-1"></i> नया स्टूडेंट
                </button>
            </div>
            <div id="students-list" class="space-y-3">
                <!-- स्टूडेंट्स की लिस्ट यहाँ आएगी -->
                <p class="text-gray-400 text-center py-10 text-sm">अभी कोई स्टूडेंट नहीं जोड़ा गया है।</p>
            </div>
        </div>

    </div>

    <!-- ================== 2. बॉटम नेविगेशन (Professional Navigation) ================== -->
    <div class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 flex justify-around items-center py-3 pb-safe z-50 rounded-t-2xl shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
        <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center gap-1 text-purple-600 transition">
            <i class="fas fa-home text-lg"></i>
            <span class="text-[10px] font-semibold">Home</span>
        </button>
        <button onclick="switchTab('classes')" id="nav-classes" class="flex flex-col items-center gap-1 text-gray-400 hover:text-purple-600 transition">
            <i class="fas fa-users text-lg"></i>
            <span class="text-[10px] font-medium">Classes</span>
        </button>
        <button onclick="switchTab('students')" id="nav-students" class="flex flex-col items-center gap-1 text-gray-400 hover:text-purple-600 transition">
            <i class="fas fa-user-graduate text-lg"></i>
            <span class="text-[10px] font-medium">Students</span>
        </button>
    </div>

    <!-- ================== 3. डेटा जोड़ने का पॉपअप (Modal) ================== -->
    <div id="add-modal" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl">
            <h3 id="modal-title" class="text-xl font-bold text-gray-800 mb-4">नई क्लास जोड़ें</h3>
            <input type="text" id="modal-input" placeholder="नाम यहाँ लिखें..." class="w-full border border-gray-300 rounded-xl px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-purple-500">
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-semibold active:scale-95 transition">रद्द करें</button>
                <button onclick="saveData()" class="flex-1 bg-purple-600 text-white py-3 rounded-xl font-semibold shadow-md active:scale-95 transition">सेव करें</button>
            </div>
        </div>
    </div>

    <!-- ================== जावास्क्रिप्ट कोड (पूरा लॉजिक) ================== -->
    <script>
        // --- 1. डेटा सेटअप (Local Storage) ---
        let classes = JSON.parse(localStorage.getItem('acharya_classes_list')) || [];
        let students = JSON.parse(localStorage.getItem('acharya_students_list')) || [];
        let currentAddType = 'class';

        // --- 2. नेविगेशन लॉजिक ---
        function switchTab(tabId) {
            // सभी स्क्रीन छुपाएं
            document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));
            // चुनी हुई स्क्रीन दिखाएं
            document.getElementById('screen-' + tabId).classList.add('active');

            // नेविगेशन बटन का रंग बदलें
            document.querySelectorAll('button[id^="nav-"]').forEach(btn => {
                btn.classList.remove('text-purple-600', 'font-semibold');
                btn.classList.add('text-gray-400');
            });
            let activeNav = document.getElementById('nav-' + tabId);
            if(activeNav) {
                activeNav.classList.remove('text-gray-400');
                activeNav.classList.add('text-purple-600', 'font-semibold');
            }
        }

        // --- 3. मोडल (Popup) लॉजिक ---
        function openAddModal(type) {
            currentAddType = type;
            document.getElementById('modal-title').innerText = type === 'class' ? 'नई क्लास जोड़ें' : 'नया स्टूडेंट जोड़ें';
            document.getElementById('modal-input').value = '';
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('modal-input').focus();
        }

        function closeModal() {
            document.getElementById('add-modal').classList.add('hidden');
        }

        // --- 4. डेटा सेव करने का लॉजिक ---
        function saveData() {
            let value = document.getElementById('modal-input').value.trim();
            if (!value) {
                alert("कृपया नाम लिखें!");
                return;
            }

            if (currentAddType === 'class') {
                classes.push({ id: Date.now(), name: value });
                localStorage.setItem('acharya_classes_list', JSON.stringify(classes));
            } else {
                students.push({ id: Date.now(), name: value });
                localStorage.setItem('acharya_students_list', JSON.stringify(students));
            }
            closeModal();
            renderData();
        }

        // --- 5. डेटा को स्क्रीन पर दिखाने का लॉजिक ---
        function renderData() {
            // क्लासेज अपडेट करें
            let classListDiv = document.getElementById('classes-list');
            let classCountSpan = document.getElementById('home-classes-count');
            classCountSpan.innerText = classes.length;
            
            if (classes.length === 0) {
                classListDiv.innerHTML = '<p class="text-gray-400 text-center py-10 text-sm">अभी कोई क्लास नहीं जोड़ी गई है।</p>';
            } else {
                classListDiv.innerHTML = classes.map((c, index) => `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-purple-50 text-purple-600 flex items-center justify-center font-bold">${index + 1}</div>
                            <span class="font-semibold text-gray-800">${c.name}</span>
                        </div>
                        <button onclick="deleteItem('class', ${c.id})" class="text-red-400 hover:text-red-600 p-2"><i class="fas fa-trash"></i></button>
                    </div>
                `).join('');
            }

            // स्टूडेंट्स अपडेट करें
            let studentListDiv = document.getElementById('students-list');
            let studentCountSpan = document.getElementById('home-students-count');
            studentCountSpan.innerText = students.length;

            if (students.length === 0) {
                studentListDiv.innerHTML = '<p class="text-gray-400 text-center py-10 text-sm">अभी कोई स्टूडेंट नहीं जोड़ा गया है।</p>';
            } else {
                studentListDiv.innerHTML = students.map((s, index) => `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-green-50 text-green-600 flex items-center justify-center font-bold"><i class="fas fa-user"></i></div>
                            <span class="font-semibold text-gray-800">${s.name}</span>
                        </div>
                        <button onclick="deleteItem('student', ${s.id})" class="text-red-400 hover:text-red-600 p-2"><i class="fas fa-trash"></i></button>
                    </div>
                `).join('');
            }
        }

        // --- 6. आइटम डिलीट करने का लॉजिक ---
        function deleteItem(type, id) {
            if (!confirm("क्या आप इसे डिलीट करना चाहते हैं?")) return;
            if (type === 'class') {
                classes = classes.filter(c => c.id !== id);
                localStorage.setItem('acharya_classes_list', JSON.stringify(classes));
            } else {
                students = students.filter(s => s.id !== id);
                localStorage.setItem('acharya_students_list', JSON.stringify(students));
            }
            renderData();
        }

        // --- 7. ऐप शेयर करने का लॉजिक (WhatsApp, Insta, etc.) ---
        function shareApp() {
            if (navigator.share) {
                navigator.share({
                    title: 'AcharyaOS - The Teacher\'s OS',
                    text: 'शिक्षकों के लिए एक आधुनिक डिजिटल सहायक। क्लास, स्टूडेंट्स और अटेंडेंस को मैनेज करें आसानी से।',
                    url: window.location.href
                }).catch((err) => console.log('Error sharing', err));
            } else {
                // अगर मोबाइल में शेयर सपोर्ट नहीं है, तो लिंक कॉपी करें
                navigator.clipboard.writeText(window.location.href);
                alert("लिंक कॉपी हो गया है! अब आप इसे WhatsApp पर भेज सकते हैं।");
            }
        }

        // --- 8. ऐप शुरू होने पर सब कुछ लोड करें ---
        document.addEventListener('DOMContentLoaded', () => {
            // आज की तारीख
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('hi-IN', dateOptions);
            
            // डेटा रेंडर करें
            renderData();

            // PWA (Service Worker) रजिस्टर करें
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW error', err));
            }
        });
    </script>
</body>
</html>
